        data.forEach(item => {

            if (item.category) tags.add(item.category);
            if (item.class) tags.add(item.class);

        });
        containerEl.innerHTML = html;
        containerEl.classList.remove('opacity-0');

        containerEl.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                containerEl.querySelectorAll('button').forEach(b => {
                    b.classList.remove('bg-blue-600', 'border-blue-400', 'text-white');
                    b.classList.add('bg-white/5', 'border-white/10', 'text-slate-400');
                });
                btn.classList.add('bg-blue-600', 'border-blue-400', 'text-white');

                const val = btn.dataset.val;
                if (val === 'all') { onSelect(data); return; }
                onSelect(data.filter(item => item.subject === val || item.category === val || item.class === val));
            });
        });
    }

    // --- FREE TESTS (courses collection) ---
    async function loadFreeTests() {
        const grid = document.getElementById('detail-grid');
        grid.innerHTML = `<div class="col-span-full py-16 text-center font-mono text-slate-500 tracking-widest animate-pulse">INITIALIZING DATABASE_SYNC...</div>`;
        try {
            if (testSeriesData === null) {
                const snap = await db.doc(EDUCATOR_PATH).collection('courses').where('status', '==', 'approved').get();
                testSeriesData = [];
                snap.forEach(doc => testSeriesData.push({ id: doc.id, ...doc.data() }));
            }
            buildFilters(testSeriesData, document.getElementById('detail-filters'), renderTests);
            renderTests(testSeriesData);
        } catch (err) {
            console.error(err);
            grid.innerHTML = `<div class="col-span-full text-red-400 text-center">Connection Failed.</div>`;
        }
    }

    function renderTests(dataArray) {
        const grid = document.getElementById('detail-grid');
        let html = dataArray.map(data => `
            <div class="glass-panel tech-card rounded-2xl p-6 group" style="--tc-accent:#3b82f6; --tc-glow:rgba(59,130,246,0.5);">
                <div class="flex items-start justify-between mb-6">
                    <div class="bg-blue-500/10 p-3 rounded-xl">
                        <i class="fas fa-file-pdf text-2xl text-blue-500"></i>
                    </div>
                    <span class="text-[10px] text-slate-500 font-bold border border-white/10 px-2 py-1 rounded tracking-tighter uppercase">
                        ${data.subject || 'Document'}
                    </span>
                </div>
                <h3 class="text-xl font-bold mb-2 group-hover:text-blue-400 transition-colors">${data.name || data.title}</h3>
                <p class="text-slate-400 text-sm mb-8 line-clamp-2">${data.description || 'Access high-quality PDF test materials.'}</p>
                <a href="${data.link}" target="_blank" class="block w-full text-center py-3 bg-white/5 hover:bg-blue-600 rounded-xl font-bold text-xs tracking-widest uppercase transition-all border border-white/5 hover:border-blue-400">
                    OPEN REPOSITORY <i class="fas fa-arrow-right ml-2 text-[10px]"></i>
                </a>
            </div>`).join('');
        grid.innerHTML = html || `<div class="col-span-full text-center text-slate-500">Empty Directory.</div>`;
    }

    // --- JEE PYQ (quizzes collection) ---
    async function loadJeePyq() {
        const grid = document.getElementById('detail-grid');
        grid.innerHTML = `<div class="col-span-full py-16 text-center font-mono text-slate-500 tracking-widest animate-pulse">INITIALIZING DATABASE_SYNC...</div>`;
        try {
            if (quizData === null) {
                const snap = await db.doc(EDUCATOR_PATH).collection('quizzes').get();
                quizData = [];
                snap.forEach(doc => quizData.push({ id: doc.id, ...doc.data() }));
            }
            buildFilters(quizData, document.getElementById('detail-filters'), renderQuizzes);
            renderQuizzes(quizData);
        } catch (err) {
            console.error(err);
            grid.innerHTML = `<div class="col-span-full text-red-400 text-center">Connection Failed.</div>`;
        }
    }

    function renderQuizzes(dataArray) {
        const grid = document.getElementById('detail-grid');
        let html = dataArray.map(data => `
            <div class="glass-panel tech-card rounded-2xl p-6 border-l-4 border-l-yellow-500/50" style="--tc-accent:#eab308; --tc-glow:rgba(234,179,8,0.5);">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span>
                        <span class="text-[10px] font-black text-green-500 uppercase tracking-widest">Live Engine</span>
                    </div>
                    <span class="text-[10px] text-slate-500 font-bold border border-white/10 px-2 py-1 rounded uppercase">
                        ${data.subject || 'General'}
                    </span>
                </div>
                <h3 class="text-xl font-black mb-4 uppercase tracking-tight text-white">${data.title}</h3>
                <div class="flex gap-4 mb-8">
                    <div class="bg-white/5 px-3 py-1 rounded text-[10px] font-bold text-slate-400">
                        <i class="far fa-clock mr-1 text-yellow-500"></i> ${data.duration}m
                    </div>
                    <div class="bg-white/5 px-3 py-1 rounded text-[10px] font-bold text-slate-400">
                        <i class="far fa-question-circle mr-1 text-blue-500"></i> ${data.questions} Qs
                    </div>
                </div>
                <a href="/quiz/quizzes.html?uid=${data.targetQuizId || data.id}" class="block w-full text-center py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black text-xs tracking-[0.2em] uppercase transition-all shadow-lg shadow-blue-900/40">
                    START PROTOCOL
                </a>
            </div>`).join('');
        grid.innerHTML = html || `<div class="col-span-full text-center text-slate-500">No active engines.</div>`;
    }

    // --- AITS 2027 helpers ---
    function aitsFormatDate(iso) {
        const d = new Date(iso + 'T00:00:00');
        return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function aitsStatus(iso) {
        const now = new Date();
        const testDay = new Date(iso + 'T00:00:00');
        const dayAfter = new Date(testDay.getTime() + 24 * 60 * 60 * 1000);
        if (now < testDay) {
            const diffDays = Math.ceil((testDay - now) / (1000 * 60 * 60 * 24));
            return { state: 'locked', label: `Unlocks in ${diffDays} day${diffDays === 1 ? '' : 's'}` };
        }
        if (now < dayAfter) return { state: 'live', label: 'Live Today' };
        return { state: 'closed', label: 'Window Closed' };
    }

    window.openAitsTest = function (index) {
        const item = AITS_DATA[index];
        if (item.targetQuizId) {
            window.location.href = `/quiz/quizzes.html?uid=${item.targetQuizId}`;
        } else {
            showToast(`${item.testName} is live, but the link isn't published yet. Check back shortly.`);
        }
    };

    function renderBatchTimeline() {
        const body = document.getElementById('batch-body');
        body.innerHTML = `<div id="batch-timeline" class="timeline"></div>`;
        const container = document.getElementById('batch-timeline');
        container.innerHTML = AITS_DATA.map((item, index) => {
            const status = aitsStatus(item.date);
            const isUnlocked = status.state !== 'locked';
            const stateClass = status.state === 'live' ? 'is-live' : (isUnlocked ? 'is-unlocked' : '');
            const ribbonClass = status.state === 'live' ? 'live' : 'locked';
            const ribbonIcon = status.state === 'live' ? 'fa-broadcast-tower' : 'fa-lock';
            return `
            <div class="timeline-item ${stateClass}">
                <div class="timeline-dot">${String(item.testNumber).padStart(2, '0')}</div>
                <div class="timeline-card">
                    <div class="flex items-start justify-between gap-3 mb-3">
                        <div>
                            <h3 class="text-lg font-black text-white tracking-tight">${item.testName}</h3>
                            <div class="flex flex-wrap items-center gap-3 mt-1 text-[11px] text-slate-400 font-semibold">
                                <span><i class="far fa-calendar mr-1" style="color:#d4af37;"></i>${aitsFormatDate(item.date)}</span>
                                <span><i class="far fa-clock mr-1" style="color:#d4af37;"></i>${item.testTime}</span>
                                <span class="border border-white/10 rounded px-2 py-0.5 uppercase tracking-widest text-[9px]">${item.pattern}</span>
                            </div>
                        </div>
                        <span class="status-ribbon ${ribbonClass} shrink-0"><i class="fas ${ribbonIcon} mr-1"></i>${status.label}</span>
                    </div>
                    <div class="subject-row">
                        <p class="subject-label text-blue-400 mb-1">Physics</p>
                        <p class="text-slate-300 text-xs leading-relaxed">${item.physics}</p>
                    </div>
                    <div class="subject-row">
                        <p class="subject-label text-emerald-400 mb-1">Chemistry</p>
                        <p class="text-slate-300 text-xs leading-relaxed">${item.chemistry}</p>
                    </div>
                    <div class="subject-row">
                        <p class="subject-label text-pink-400 mb-1">Biology</p>
                        <p class="text-slate-300 text-xs leading-relaxed">${item.biology}</p>
                    </div>
                    <button
                        onclick="${isUnlocked ? `openAitsTest(${index})` : ''}"
                        ${isUnlocked ? '' : 'disabled'}
                        class="w-full text-center py-3 mt-5 rounded-xl font-black text-[11px] uppercase aits-cta ${isUnlocked ? 'unlocked-btn' : 'locked-btn'}">
                        ${isUnlocked ? '<i class="fas fa-unlock mr-2"></i>Start Test' : '<i class="fas fa-lock mr-2"></i>Locked'}
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    // --- SHARE (per-batch, works from the card OR from inside the detail view) ---
    window.shareBatch = function (id) {
        const targetId = id || currentBatchId;
        const meta = BATCH_META.find(b => b.id === targetId) || BATCH_META[0];
        const url = window.location.origin + window.location.pathname + `?batch=${meta.id}#batch`;
        const shareData = {
            title: `${meta.title} — Neelaxmi`,
            text: `Join the ${meta.title} batch on Neelaxmi — ${meta.subtitle}. Free to join!`,
            url
        };
        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(() => showToast(`${meta.title} link copied to clipboard!`));
        } else {
            showToast(url);
        }
    };

    // --- BATCH CARD GRID ---
    function renderBatchCards() {
        const grid = document.getElementById('batch-grid');
        grid.innerHTML = BATCH_META.map(batch => `
            <div class="batch-card" onclick="openBatchDetail('${batch.id}')">
                <button class="card-share-btn" onclick="event.stopPropagation(); shareBatch('${batch.id}')" title="Share ${batch.title}">
                    <i class="fas fa-share-nodes"></i>
                </button>
                <div class="batch-card-art">
                    <div class="art-blob" style="background:${batch.accent}22;"></div>
                    <i class="fas ${batch.iconMain} art-icon-main" style="color:${batch.accent};"></i>
                    ${batch.chips.map(c => `<span class="art-chip" style="background:${c.bg}; ${c.pos}"><i class="fas ${c.icon}"></i></span>`).join('')}
                </div>
                <div class="relative z-10">
                    <p class="batch-card-title">${batch.title}</p>
                    <p class="batch-card-sub">${batch.subtitle}</p>
                </div>
                <span class="batch-card-view relative z-10">View <i class="fas fa-chevron-right"></i></span>
            </div>`).join('');
    }

    // --- OPEN / CLOSE BATCH DETAIL ---
    window.openBatchDetail = function (id) {
        const batch = BATCH_META.find(b => b.id === id);
        if (!batch) return;
        currentBatchId = id;

        const heroEl = document.getElementById('batch-hero-content');
        heroEl.className = `batch-hero rounded-3xl p-6 md:p-10 mb-10 ${batch.type === 'aits' ? 'is-aits' : ''}`;
        heroEl.innerHTML = `
            <div class="relative flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                <div>
                    <p class="text-[10px] tracking-[0.3em] uppercase font-bold" style="color:${batch.accent};">${batch.code}</p>
                    <h3 class="text-2xl md:text-3xl font-extrabold text-white mt-1">${batch.title}</h3>
                    <p class="text-slate-400 text-sm mt-2 max-w-md">${batch.description}</p>
                    <div class="flex flex-wrap gap-3 mt-4 text-[11px] text-slate-300 font-semibold">
                        ${batch.stats.map(s => `<span class="bg-white/5 border border-white/10 rounded-full px-3 py-1"><i class="fas ${s.icon} mr-1" style="color:${batch.accent};"></i> ${s.label}</span>`).join('')}
                    </div>
                </div>
                <button onclick="shareBatch()" class="share-btn shrink-0 flex items-center gap-2 px-6 py-3 rounded-xl font-black text-xs uppercase" style="--sb-c1:${batch.accent}; --sb-c2:${batch.accent2}; --sb-glow:${batch.accentGlow};">
                    <i class="fas fa-share-nodes"></i> Share Batch
                </button>
            </div>
            <div class="batch-divider"></div>
            <p class="relative text-[11px] text-slate-500 font-mono tracking-widest uppercase">${batch.subtitle}</p>`;

        if (batch.type === 'aits') {
            renderBatchTimeline();
        } else {
            document.getElementById('batch-body').innerHTML = `
                <div id="detail-filters" class="mb-6 flex flex-wrap gap-3 opacity-0 transition-opacity duration-500"></div>
                <div id="detail-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>`;
            if (batch.type === 'tests') loadFreeTests();
            if (batch.type === 'quiz') loadJeePyq();
        }

        document.getElementById('batch-detail').classList.remove('hidden');
        document.getElementById('batch-grid').classList.add('hidden');
        document.getElementById('batch').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.closeBatchDetail = function () {
        document.getElementById('batch-detail').classList.add('hidden');
        document.getElementById('batch-grid').classList.remove('hidden');
        currentBatchId = null;
        document.getElementById('batch').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    // --- SCROLL REVEAL ---
    function initReveal() {
        const io = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in-view'); });
        }, { threshold: 0.12 });
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }

    // --- DEEP LINK: ?batch=<id> opens that single card directly ---
    function handleDeepLink() {
        const params = new URLSearchParams(window.location.search);
        const batchId = params.get('batch');
        if (batchId && BATCH_META.some(b => b.id === batchId)) {
            setTimeout(() => openBatchDetail(batchId), 400);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchStats();
        renderBatchCards();
        initReveal();
        handleDeepLink();
    });
</script>
