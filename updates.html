    <style>
        :root {
            --primary: #00d2ff;
            --primary-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(0, 210, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 210, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(58, 123, 213, 0.05), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HEADER --- */
        .page-header {
            width: 100%;
            padding: 2rem 1rem;
            text-align: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-title {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .header-subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* --- MAIN FEED --- */
        .feed-container {
            width: 100%;
            max-width: 800px;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- NOTIFICATION CARD --- */
        .notif-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease backwards;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notif-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 210, 255, 0.4);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .notif-card.new-alert {
            border-left: 4px solid var(--primary);
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.05) 0%, transparent 100%), var(--card-bg);
        }

        .new-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        .notif-banner {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .notif-content-top {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 60px; /* Space for new badge */
        }

        .notif-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }

        .notif-time {
            font-size: 0.8rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .notif-msg {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .notif-action-btn {
            align-self: flex-start;
            padding: 10px 24px;
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            border: 1px solid rgba(0, 210, 255, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .notif-action-btn:hover {
            background: var(--primary);
            color: #0f172a;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* --- LOADING & EMPTY STATES --- */
        .loader {
            display: flex;
            justify-content: center;
            padding: 3rem;
            color: var(--primary);
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-dim);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* --- ANIMATIONS --- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
        }

        /* --- NAVIGATION BACK BUTTON --- */
        .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            text-decoration: none;
            font-size: 1.5rem;
            transition: 0.3s;
        }
        .back-btn:hover { color: var(--primary); }

        @media (max-width: 600px) {
            .back-btn { position: static; transform: none; display: block; margin-bottom: 10px; }
        }

    </style>
</head>
<body>

    <header class="page-header">
        <a href="/index.html" class="back-btn" title="Back to Home"><i class="fas fa-arrow-left"></i></a>
        <h1 class="header-title">Neelaxmi update Center</h1>
        <p class="header-subtitle"><i class="fas fa-satellite-dish"></i> NEET UPDATES AND INFORMATIONS</p>
    </header>

    <main class="feed-container" id="notifList">
        <div class="loader"><i class="fas fa-circle-notch"></i></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        // 1. Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDAZ_xwRd_uJcf-Gzv58HA9f_HZ7BCCJ8g",
            authDomain: "gallery-83144.firebaseapp.com",
            projectId: "gallery-83144",
            storageBucket: "gallery-83144.firebasestorage.app",
            messagingSenderId: "1005577519231",
            appId: "1:1005577519231:web:638899904126ae78cdff4a"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Fetch tracking timestamp
        let lastOpenedTime = localStorage.getItem('saksen_notif_last_viewed');
        lastOpenedTime = lastOpenedTime ? parseInt(lastOpenedTime) : 0;

        // 3. Setup Listener
        db.collection("notifications")
          .orderBy("timestamp", "desc") 
          .limit(30)
          .onSnapshot((snapshot) => {
            const list = document.getElementById('notifList');
            list.innerHTML = ''; // Clear loader or old data

            if (snapshot.empty) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="far fa-bell-slash"></i>
                        <h2>All caught up!</h2>
                        <p>There are no new notifications at this time.</p>
                    </div>`;
                return;
            }

            let delay = 0; // For staggered animation

            snapshot.forEach((doc) => {
                const data = doc.data();
                let notifTimeMs = 0;
                let timeString = 'Just now';
                
                if (data.timestamp) {
                    notifTimeMs = data.timestamp.seconds * 1000;
                    timeString = new Date(notifTimeMs).toLocaleDateString([], {
                        month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'
                    });
                }

                const isNew = notifTimeMs > lastOpenedTime;

                // Build Elements
                const article = document.createElement('article');
                article.className = `notif-card ${isNew ? 'new-alert' : ''}`;
                article.style.animationDelay = `${delay}s`;
                delay += 0.05;

                const newBadgeHtml = isNew ? `<div class="new-badge">NEW</div>` : '';
                
                const imgHtml = data.img ? 
                    `<img src="${data.img}" class="notif-banner" alt="Notification Update">` : '';
                
                const btnHtml = data.link ? 
                    `<a href="${data.link}" target="_blank" class="notif-action-btn">
                        ${data.btnText || 'Read More'} <i class="fas fa-external-link-alt"></i>
                     </a>` : '';

                article.innerHTML = `
                    ${newBadgeHtml}
                    ${imgHtml}
                    <div class="notif-content-top">
                        <h2 class="notif-title">${data.title}</h2>
                        <div class="notif-time"><i class="far fa-clock"></i> ${timeString}</div>
                    </div>
                    <div class="notif-msg">${data.message}</div>
                    ${btnHtml}
                `;

                list.appendChild(article);
            });

            // 4. Mark as read automatically once they load this page
            localStorage.setItem('saksen_notif_last_viewed', Date.now());
        });
    </script>
    <script src="/js/head-loader.js"></script>
</body>
</html>
